<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafeteria Aroma</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        
        header {
            padding: 3rem 1rem;
        }
        
        header h1 {
            font-size: 3rem;
            margin-bottom: 2rem;
        }
        
        main {
            padding: 2rem 1rem;
        }
        
        section {
            margin-bottom: 3rem;
        }
        
        section h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        
        .galeria {
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }
        
        .cafe-item {
            text-align: center;
        }
        
        .cafe-item p {
            font-weight: bold;
            margin-top: 0.5rem;
        }
        
        .galeria img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }
        
        form {
            max-width: 500px;
            margin: 2rem auto;
            padding: 1.5rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            text-align: left;
        }
        
        fieldset {
            border: none;
            padding: 1rem 0;
            margin-bottom: 1rem;
        }
        
        legend {
            font-weight: bold;
            margin-bottom: 1rem;
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.3rem;
            font-weight: bold;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        button {
            background-color: #8B4513;
            color: white;
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
        }
        
        button:hover {
            background-color: #A0522D;
        }
        
        footer {
            padding: 2rem 1rem;
            border-top: 1px solid #ddd;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>☕ Cafeteria Aroma</h1>
    </header>

    <main>
        <section>
            <h2>Nossas Bebidas</h2>
            <div class="galeria">
                <div class="cafe-item">
                    <img src="café expresso.webp" alt="Café Espresso">
                    <p>Café Espresso</p>
                </div>
                <div class="cafe-item">
                    <img src="cappucino.jpg" alt="Cappuccino">
                    <p>Cappuccino</p>
                </div>
                <div class="cafe-item">
                    <img src="café gelado.webp" alt="Café Gelado">
                    <p>Café Gelado</p>
                </div>
            </div>
        </section>


    </main>

    <footer>
    </footer>
</body>
</html>
